name: Build St. Joseph Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "cmake;3.22.1" "ndk;26.1.10909125"

      - name: Fetch website bundle (cloud)
        run: |
          mkdir -p app/src/main/assets/nodejs-project
          curl -L --fail --retry 3 -o website.zip https://github.com/davidprinceakpotewere-ship-it/prince/releases/download/test/StJosephResultChecker.1.3.0.zip
          python3 -c "import zipfile; zipfile.ZipFile('website.zip').extractall('website-extract')"
          src=$(find website-extract -maxdepth 2 -type d -name lib | head -1)
          root=$(dirname "$src")
          cp -r "$root"/* app/src/main/assets/nodejs-project/

      - name: Fetch nodejs-mobile runtime (cloud)
        run: |
          curl -L --fail --retry 3 -o node-mobile.zip https://github.com/JaneaSystems/nodejs-mobile/releases/download/nodejs-mobile-v0.3.3/nodejs-mobile-v0.3.3-android.zip
          python3 -c "import zipfile; zipfile.ZipFile('node-mobile.zip').extractall('node-mobile')"
          mkdir -p app/libnode/bin app/libnode/include/node
          for pair in "arm64-v8a:arm64" "armeabi-v7a:arm" "x86_64:x64" "x86:x86"; do
            abi=${pair%%:*}; alias=${pair##*:}
            mkdir -p app/libnode/bin/$abi
            so=$(find node-mobile -name libnode.so | grep -i "$alias" | head -1)
            if [ -z "$so" ]; then so=$(find node-mobile -name libnode.so | head -1); fi
            [ -n "$so" ] && cp "$so" app/libnode/bin/$abi/libnode.so
          done
          hdr=$(find node-mobile -type d -name node | head -1)
          [ -n "$hdr" ] && cp -r "$hdr"/. app/libnode/include/node/ || true
          ls -la app/libnode/bin/*/libnode.so

      - name: Build APK
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          gradle assembleRelease --no-daemon -Dorg.gradle.java.home=$JAVA_HOME

      - name: Collect and upload APK
        run: |
          mkdir -p artifacts
          find . -name "*.apk" -exec cp {} artifacts/StJosephResultChecker.apk \;
          ls -la artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: StJosephResultChecker-APK
          path: artifacts/StJosephResultChecker.apk
      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload v1.2.0 artifacts/StJosephResultChecker.apk --clobber || true
