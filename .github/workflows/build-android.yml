name: Build St. Joseph Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android_app/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmake-version: '3.22.1'
          ndk-version: '26.1.10909125'

      - name: Install Android platform/tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Fetch website bundle (cloud)
        run: |
          mkdir -p app/src/main/assets/nodejs-project
          curl -L --fail --retry 3 -o website.zip \
            https://github.com/davidprinceakpotewere-ship-it/prince/releases/download/test/StJosephResultChecker.1.3.0.zip
          unzip -q website.zip -d website-extract
          src=$(find website-extract -maxdepth 2 -type d -name lib | head -1)
          root=$(dirname "$src")
          cp -r "$root"/* app/src/main/assets/nodejs-project/
          find app/src/main/assets/nodejs-project -maxdepth 1 | head -20

      - name: Download nodejs-mobile runtime (cloud)
        run: |
          curl -L --fail --retry 3 -o node-mobile.zip \
            https://github.com/JaneaSystems/nodejs-mobile/releases/download/nodejs-mobile-v0.3.3/nodejs-mobile-v0.3.3-android.zip
          unzip -q node-mobile.zip -d node-mobile
          echo "=== zip layout ==="
          find node-mobile -maxdepth 3 -type f | head -40
          echo "=== placing libnode.so + headers ==="
          mkdir -p app/libnode/bin
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            mkdir -p app/libnode/bin/$abi
            so=$(find node-mobile -name "libnode.so" -path "*$abi*" | head -1)
            if [ -z "$so" ]; then so=$(find node-mobile -name "libnode.so" | grep -i "${abi/arm64/aarch64}" | head -1); fi
            if [ -n "$so" ]; then cp "$so" app/libnode/bin/$abi/libnode.so; fi
          done
          hdr=$(find node-mobile -type d -name node | head -1)
          if [ -n "$hdr" ]; then
            mkdir -p app/libnode/include/node
            cp "$hdr"/*.h app/libnode/include/node/ 2>/dev/null || true
          fi
          ls -la app/libnode/bin/*/libnode.so || true

      - name: Grant Gradle wrapper
        working-directory: .
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; fi

      - name: Build APK
        working-directory: .
        run: |
          if [ -f gradlew ]; then ./gradlew assembleRelease --no-daemon; else gradle assembleRelease --no-daemon; fi

      - name: Collect APK
        run: |
          mkdir -p artifacts
          find . -name "*.apk" -exec cp {} artifacts/StJosephResultChecker.apk \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StJosephResultChecker-APK
          path: artifacts/StJosephResultChecker.apk

      - name: Attach APK to release v1.2.0
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.2.0 artifacts/StJosephResultChecker.apk --clobber || true
